<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>three.js scene</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"../build/three.module.js","three/addons/":"../examples/jsm/"}}</script>
</head><body>
<!-- Serve over http (e.g. python3 -m http.server); imported models must sit next to this file. -->
<script type="module">
// Generated by the three.js editor fork ("three.js code" exporter). Edit freely: every line is plain three.js.
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// @key Scene and camera | The scene holds what exists; the camera says where we look from.
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(4, 3, 6);
// @/key

// @key Renderer | Draws the scene, seen through the camera, onto a canvas element.
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
document.body.append(renderer.domElement);   // domElement is the <canvas>
// @/key

const controls = new OrbitControls(camera, renderer.domElement);   // drag to orbit, wheel to zoom
controls.target.set(0, 0.5, 0);
controls.update();

const gltfLoader = new GLTFLoader();
const objLoader = new OBJLoader();
const mixers = [];   // one AnimationMixer per animated model

// @key Scene contents | Objects, lights and their hierarchy (add() puts a child inside a parent).
scene.background = new THREE.Color(0x111122);
scene.fog = new THREE.Fog(0x111122, 5, 20);   // colour, near, far

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(10, 10),
  new THREE.MeshStandardMaterial({ color: 0x335566, roughness: 0.9, metalness: 0 })
);
ground.name = "Ground";
ground.rotation.set(-1.5708, 0, 0);   // radians
ground.receiveShadow = true;
scene.add(ground);

const rig = new THREE.Group();
rig.name = "Rig";
rig.position.set(0, 0.5, 0);
scene.add(rig);

const cube = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color: 0xff6644, roughness: 0.5, metalness: 0.1 })
);
cube.name = "Cube";
cube.rotation.set(0, 0.6, 0);   // radians
cube.castShadow = true;
rig.add(cube);

const orb = new THREE.Mesh(
  new THREE.SphereGeometry(0.5, 32, 16),
  new THREE.MeshStandardMaterial({ color: 0x44ddaa, roughness: 1, metalness: 0 })
);
orb.name = "Orb";
orb.position.set(1.8, 0.5, 0.5);
orb.scale.set(1, 1.2, 1);
scene.add(orb);

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.name = "Sun";
sun.position.set(3, 5, 2);
sun.castShadow = true;
sun.shadow.camera.left = -5; sun.shadow.camera.right = 5; sun.shadow.camera.top = 5; sun.shadow.camera.bottom = -5;
scene.add(sun);

const fill = new THREE.AmbientLight(0x404060, 1);
fill.name = "Fill";
scene.add(fill);

// Imported model: knot.obj (keep this file next to the page)
const knot = await objLoader.loadAsync("knot.obj");
knot.position.set(0, 1.5, -2);
scene.add(knot);

// Imported model: spinner.glb (keep this file next to the page)
const spinnerGltf = await gltfLoader.loadAsync("spinner.glb");
const spinner = spinnerGltf.scene;
spinner.position.set(-2, 1, -1);
scene.add(spinner);
// Animations in this file: "Spin", "Bob"
const spinnerMixer = new THREE.AnimationMixer(spinner);
mixers.push(spinnerMixer);
spinnerMixer.clipAction(THREE.AnimationClip.findByName(spinnerGltf.animations, "Spin")).play();
// spinnerMixer.clipAction(THREE.AnimationClip.findByName(spinnerGltf.animations, "Bob")).play();

// @/key

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// @key The loop | Called every frame with the time in milliseconds.
let last = performance.now();
renderer.setAnimationLoop((t) => {
  const dt = (t - last) / 1000;   // seconds since the previous frame
  for (const m of mixers) m.update(dt);
  last = t;
  controls.update();
  renderer.render(scene, camera);
});
// @/key
</script>
</body></html>
